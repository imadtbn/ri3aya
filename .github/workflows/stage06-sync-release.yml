name: Stage 06 sync generated release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage06-sync-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-generated-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install generator dependency
        run: python -m pip install beautifulsoup4
      - name: Rebuild shared layout
        run: python scripts/sync_layout.py
      - name: Rebuild article library, metadata and sitemap
        run: python scripts/build_articles.py
      - name: Verify deterministic layout
        run: python scripts/sync_layout.py --check
      - name: Rebuild hashed PWA cache manifest last
        run: python scripts/build_pwa.py
      - name: Verify deterministic release snapshot
        run: python scripts/build_pwa.py --check
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pages/ search/index.json sitemap.xml pwa/config.js
          if ! git diff --cached --quiet; then
            git commit -m "build(stage06): sync layout articles and hashed PWA manifest"
            git push origin HEAD:main
          fi
