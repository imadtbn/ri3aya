name: Refresh SEO branch PWA snapshot

on:
  push:
    branches: [fix/seo-source-of-truth]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seo-source-of-truth
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install generator dependency
        run: python -m pip install beautifulsoup4
      - name: Regenerate the release snapshot
        run: python scripts/build_pwa.py
      - name: Commit the generated snapshot to this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa/config.js
          if ! git diff --cached --quiet; then
            git commit -m "build(pwa): refresh SEO branch release snapshot"
            git push origin HEAD:fix/seo-source-of-truth
          fi
