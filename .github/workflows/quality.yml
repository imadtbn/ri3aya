name: ri3aya quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependency
        run: python -m pip install beautifulsoup4
      - name: Run quality gate
        run: python scripts/quality_gate.py
      - name: Verify generated shared layout
        run: python scripts/sync_layout.py --check
      - name: Verify article library and discovery data
        run: python scripts/build_articles.py --check
      - name: Verify publication and review metadata
        run: python scripts/check_article_library.py
      - name: Verify drafts, withdrawal and medical sign-off
        run: python scripts/test_article_publication.py
      - name: Verify Arabic search and age filtering
        run: node scripts/test_search.cjs
      - name: Verify local data durability and exports
        run: node scripts/test_local_data.cjs
      - name: Verify tool guidance, routine choices and growth recovery
        run: node scripts/test_tools.cjs
      - name: Verify SEO and PWA metadata
        run: python scripts/check_seo_pwa.py
      - name: Check all internal links and fragments
        run: python scripts/check_internal_links.py
      - name: Verify CSS and unified shared components
        run: node scripts/check_css_stability.mjs
      - name: Verify medical status and safety guardrails
        run: node scripts/check_medical_safety.mjs
      - name: Verify tools, dates and search boundaries
        run: node scripts/test_stage04.cjs
      - name: Verify ad placeholders and offline asset guards
        run: node scripts/test_stage05.cjs
      - name: Verify release snapshot
        run: python scripts/build_pwa.py --check

  browser-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare visual evidence directory
        run: mkdir -p artifacts/screens
      - name: Responsive and tool acceptance
        env:
          LAYOUT_SCREENSHOT_DIR: artifacts/screens
        run: node scripts/check_layout.mjs
      - name: Real offline and update acceptance
        run: node scripts/check_pwa.mjs
      - name: Capture synthetic rendering performance
        run: node scripts/measure_performance.mjs
      - name: Upload performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri3aya-stage06-performance
          path: artifacts/performance-lab.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri3aya-stage06-visual-evidence
          path: artifacts/screens
          if-no-files-found: ignore
          retention-days: 7

  stable-release:
    name: Verify published site and tag stable release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, browser-acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for GitHub Pages to serve verified PWA revision
        shell: bash
        run: |
          set -euo pipefail
          revision=$(sed -n 's/.*"revision":"\([^"]*\)".*/\1/p' pwa/config.js)
          test -n "$revision"
          echo "Verified repository revision: $revision"
          for attempt in $(seq 1 18); do
            if curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "https://imadtbn.github.io/ri3aya/pwa/config.js?verify=${GITHUB_SHA}" \
              | grep -Fq "\"revision\":\"$revision\""; then
              echo "GitHub Pages serves the accepted PWA release."
              exit 0
            fi
            echo "Pages has not deployed the accepted revision yet (attempt $attempt/18)."
            sleep 10
          done
          echo "::error::Published version does not match verified repository release."
          exit 1
      - name: Tag accepted stable version
        shell: bash
        run: |
          set -euo pipefail
          tag=ri3aya-stable-20261012
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Stable release tag already exists: $tag"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Ri3aya stage 06: tests passed, offline PWA and Pages revision verified"
          git push origin "refs/tags/$tag"
