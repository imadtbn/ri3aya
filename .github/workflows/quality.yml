name: ri3aya quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependency
        run: python -m pip install beautifulsoup4
      - name: Run quality gate
        run: python scripts/quality_gate.py
      - name: Verify generated shared layout
        run: python scripts/sync_layout.py --check
      - name: Verify article library and discovery data
        run: python scripts/build_articles.py --check
      - name: Verify publication and review metadata
        run: python scripts/check_article_library.py
      - name: Verify drafts, withdrawal and medical sign-off
        run: python scripts/test_article_publication.py
